<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>

  <link rel="stylesheet" href="styles/chat.css">
</head>

<body>

  <div class="chat-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-header">

        <div class="sidebar-title">
          <span>Chat</span>

          <button
            class="new-chat-button"
            id="new-chat-button"
            title="Novo chat"
          >
            +
          </button>
        </div>

        <!-- NOVO CHAT -->
        <div
          class="new-chat-form"
          id="new-chat-form"
        >

          <input
            type="text"
            id="username-input"
            placeholder="Nome do usuário..."
            autocomplete="off"
          >

          <div class="new-chat-actions">

            <button
              id="cancel-chat-button"
              class="cancel-button"
            >
              Cancelar
            </button>

            <button
              id="start-chat-button"
              class="start-button"
            >
              Iniciar
            </button>

          </div>

        </div>

      </div>

      <!-- PESQUISA -->
      <input
        class="search"
        id="search-input"
        type="text"
        placeholder="Pesquisar..."
      >

      <!-- CONTATOS DINÂMICOS -->
      <div
        class="contacts"
        id="contacts"
      ></div>

      <!-- RODAPÉ DA SIDEBAR -->
      <div class="sidebar-footer">

        <button
          class="logout-button"
          id="logout-button"
          title="Sair"
        >
          <span class="logout-icon">↪</span>
          <span class="logout-text">Sair</span>
        </button>

      </div>

    </aside>


    <!-- CHAT -->
    <main class="chat">

      <!-- CABEÇALHO DINÂMICO -->
      <header
        class="chat-header"
        id="chat-header"
      >

        <div
          class="avatar"
          id="chat-avatar"
        >
          ?
        </div>

        <div>

          <div
            class="user-name"
            id="chat-user-name"
          >
            Selecione uma conversa
          </div>

          <div
            class="status"
            id="chat-status"
          >
            —
          </div>

        </div>

      </header>


      <!-- MENSAGENS DINÂMICAS -->
      <section
        class="messages"
        id="messages"
      >

        <div class="empty-chat">
          Selecione um usuário para iniciar uma conversa.
        </div>

      </section>


      <!-- FORMULÁRIO -->
      <div class="message-form">

        <input
          class="message-input"
          id="message-input"
          type="text"
          placeholder="Digite uma mensagem..."
          disabled
        >

        <button
          class="send-button"
          id="send-button"
          disabled
        >
          ➤
        </button>

      </div>

    </main>

  </div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="scripts/chat.js"></script>

</body>

</html>
